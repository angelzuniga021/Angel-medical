name: Angel Medical PC
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'lib/clinical_exchange_reader.dart', 'test/clinical_exchange_reader_test.dart', '.github/workflows/build-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Preparar proyecto de escritorio
        shell: pwsh
        run: |
          Copy-Item lib/clinical_exchange_reader.dart desktop/lib/clinical_exchange_reader.dart
          Copy-Item lib/clinical_exchange_data.dart desktop/lib/clinical_exchange_data.dart
          $test = (Get-Content test/clinical_exchange_reader_test.dart -Raw).Replace("../lib/clinical_exchange_data.dart", "../lib/clinical_exchange_data.dart")
          Set-Content desktop/test/clinical_exchange_reader_test.dart $test -Encoding utf8
          cd desktop
          flutter create --platforms=windows --project-name=angel_medical_pc .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Analizar y probar Windows
        working-directory: desktop
        shell: pwsh
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compilar Windows
        working-directory: desktop
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dest = 'build/windows/x64/runner/Release'
          Copy-Item LEEME.txt $dest/LEEME.txt
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $redist = Join-Path $vs 'VC/Redist/MSVC'
          $vc = Get-ChildItem $redist -Recurse -Filter vcruntime140.dll | Where-Object { $_.FullName -match 'x64.*Microsoft.VC.*CRT' } | Select-Object -First 1
          if ($null -eq $vc) { throw 'No se encontró el runtime C++ redistribuible.' }
          Copy-Item (Join-Path $vc.DirectoryName '*.dll') $dest
          Get-FileHash "$dest/angel_medical_pc.exe" -Algorithm SHA256 | Format-List | Out-File "$dest/SHA256.txt"
      - name: Comprobar inicio del ejecutable Windows
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'desktop/build/windows/x64/runner/Release/angel_medical_pc.exe').Path
          $app = Start-Process $exe -ArgumentList '--enable-software-rendering' -PassThru
          try {
            Start-Sleep -Seconds 8
            $app.Refresh()
            if ($app.HasExited -or $app.MainWindowHandle -eq 0) { throw 'El ejecutable no abrió su ventana.' }
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save((Join-Path $env:GITHUB_WORKSPACE 'desktop-preview.png'))
            $graphics.Dispose()
            $bitmap.Dispose()
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: Angel-Medical-PC-0.1-${{ github.run_number }}
          path: desktop/build/windows/x64/runner/Release/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: Revision-PC-${{ github.run_number }}
          path: desktop-preview.png
          retention-days: 14
