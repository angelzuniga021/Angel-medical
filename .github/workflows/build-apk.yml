name: Generar APK Angel Medical
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      modo:
        description: Pruebas aisladas o APK con firma estable
        type: choice
        options: [pruebas, comunidad, personal]
        default: comunidad
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.modo || 'comunidad' }}
    timeout-minutes: 45
    env:
      ANGEL_MODE: ${{ inputs.modo || 'comunidad' }}
      ANGEL_SIGNING_JSON: ${{ secrets.ANGEL_SIGNING_JSON }}
      ANGEL_KEYSTORE_B64: ${{ secrets.ANGEL_KEYSTORE_B64 }}
      ANGEL_STORE_PASSWORD: ${{ secrets.ANGEL_STORE_PASSWORD }}
      ANGEL_KEY_ALIAS: ${{ secrets.ANGEL_KEY_ALIAS }}
      ANGEL_KEY_PASSWORD: ${{ secrets.ANGEL_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Preparar Android y firma
        run: |
          python tools/prepare_signing.py
          python tools/prepare_android.py
      - run: flutter pub get
      - name: Revisar errores de Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Pruebas
        run: |
          flutter test
          python checks/check_migration.py
          python checks/check_nom_migration.py
          python checks/check_scales_migration.py
          python checks/check_catalog_bootstrap.py
      - name: Revisar recetas PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python checks/check_recipe_pages.py
          pdftoppm -scale-to 1100 -png scale-fixture/scale.pdf scale-fixture/scale
          pdftotext scale-fixture/scale.pdf scale-fixture/scale.txt
          grep "CHA2DS2" scale-fixture/scale.txt
          pdfsig recipe-fixture/signed.pdf
          pdfsig recipe-fixture/signed.pdf | grep "Signature is Valid"
          pdftoppm -scale-to 1100 -png recipe-fixture/signed.pdf recipe-fixture/signed
          pdftoppm -scale-to 1100 -png recipe-fixture/long.pdf recipe-fixture/long
      - name: Verificar firma nativa e interoperabilidad CMS
        env:
          ANGEL_PDF_FIXTURE_DIR: ${{ github.workspace }}/recipe-fixture
          ANGEL_FIXTURE_DIR: ${{ github.workspace }}/native-fixture
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest
          cd ..
          openssl cms -verify -binary -inform DER -in native-fixture/document.p7s -content native-fixture/document.txt -noverify -out /dev/null
          printf 'altered fixture' > native-fixture/altered.txt
          if openssl cms -verify -binary -inform DER -in native-fixture/document.p7s -content native-fixture/altered.txt -noverify -out /dev/null 2>/dev/null; then
            exit 1
          fi
      - name: Verificar CMS Android integrado al PDF
        run: |
          flutter test test/clinical_native_pdf_test.dart --dart-define=NATIVE_PDF_FIXTURE=true
          pdfsig recipe-fixture/native-signed.pdf | grep "Signature is Valid"
          pdftoppm -scale-to 1100 -png recipe-fixture/native-signed.pdf recipe-fixture/native-signed
      - name: Compilar APK
        run: flutter build apk --release --dart-define=COMMUNITY_EDITION=$ANGEL_COMMUNITY --build-number=$((1000 + ${{ github.run_number }}))
      - name: Revisar proveedores de firma en APK optimizada
        run: python checks/check_release_signature.py
      - name: Preparar descarga
        run: |
          mkdir entrega
          cp build/app/outputs/flutter-apk/app-release.apk entrega/Angel-Medical-${ANGEL_MODE}.apk
          cd entrega
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Angel-Medical-${{ inputs.modo || 'comunidad' }}-${{ github.run_number }}
          path: entrega/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: Revision-recetas-${{ github.run_number }}
          path: |
            recipe-fixture/
            scale-fixture/
          retention-days: 14
